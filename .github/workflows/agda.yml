name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: wenkokke/setup-agda@v2
        with:
          agda-stdlib-version: 'recommended'

      - run: agda Everything.agda
        working-directory: src
